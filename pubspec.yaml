name: tessera_studio
description: "Pivot tables from CSV, Excel, ODS and JSON files, with charts and XLSX/ODS/HTML/SVG/PDF export. Built on the tessera engine."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  tessera_flutter: ^0.2.1
  tessera_xlsx: ^0.2.1
  tessera_ods: ^0.2.1
  tessera_html: ^0.2.0
  tessera_svg: ^0.2.0
  tessera_pdf: ^0.2.0
  file_picker: ^13.1.0
  flutter_localizations:
    sdk: flutter
  intl: any # version pinned by flutter_localizations; used by gen_l10n
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  get_it: ^9.2.1
  http: ^1.6.0
  cross_file: ^0.3.5
  shared_preferences: ^2.5.5
  desktop_drop: ^0.8.4
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  shared_preferences_platform_interface: ^2.4.2
  msix: ^3.18.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # App strings: lib/l10n/app_*.arb, generated into lib/l10n/generated/
  # by `flutter gen-l10n` (also on pub get / build); see l10n.yaml.
  generate: true

  # Noto Sans for the PDF export (subsets made by tool/subset_fonts.sh,
  # SIL OFL 1.1 in OFL.txt, registered with the LicenseRegistry).
  assets:
    - assets/fonts/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icons: the tessera icon (sources in the tessera repository,
# icon/*.svg, rasterized into assets/icon/ — not bundled into the app).
# Regenerate with
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/tessera-icon.png"
  android: true
  adaptive_icon_background: "#f2f9f6"
  adaptive_icon_foreground: "assets/icon/tessera-icon-adaptive-foreground.png"
  adaptive_icon_monochrome: "assets/icon/tessera-icon-adaptive-monochrome.png"
  web:
    generate: true
    image_path: "assets/icon/tessera-icon.png"
    background_color: "#f2f9f6"
    theme_color: "#00856e"
  windows:
    generate: true
    image_path: "assets/icon/tessera-icon.png"
    icon_size: 256
  # the App Store rejects transparent iOS icons: the paper colour behind
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#f2f9f6"
  macos:
    generate: true
    image_path: "assets/icon/tessera-icon.png"

# Windows package (MSIX) for the Microsoft Store, built by CI on Windows:
#   dart run msix:create --build-windows false
# The version comes from `version:` above (1.0.0+1 → 1.0.0.0, the fourth
# number 0 as the Store requires). PLACEHOLDERS until the name "Tessera
# Studio" is reserved in Microsoft Partner Center: identity_name and
# publisher_display_name below, and the publisher (`CN=…`), must then be
# exactly Partner Center's values. CI passes them for the Store package
# from the repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
# MSIX_PUBLISHER_DISPLAY_NAME; without them it builds a test package
# signed with the msix tool's test certificate (sideloading only).
msix_config:
  display_name: Tessera Studio
  identity_name: eu.nagylzs.TesseraStudio        # PLACEHOLDER (Partner Center)
  publisher_display_name: László Zsolt Nagy      # PLACEHOLDER (Partner Center)
  logo_path: assets/icon/tessera-icon.png
  # URLs the user opens; files come through the picker and associations
  capabilities: internetClient
  # the 14 languages of the app (pt: Brazilian, zh: Simplified)
  languages: en-us, cs-cz, de-de, es-es, fr-fr, hu-hu, it-it, ja-jp, nl-nl, pl-pl, pt-br, ru-ru, tr-tr, zh-cn
  # what the app opens (not .txt: it would claim every text file)
  file_extension: .csv, .tsv, .tab, .xlsx, .ods, .json, .jsonl, .ndjson, .tsnp
  output_path: build/msix
  output_name: tessera-studio
  install_certificate: false
