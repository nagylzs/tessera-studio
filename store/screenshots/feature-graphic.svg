<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Google Play feature graphic. Render:
       rsvg-convert feature-graphic.svg | magick - -alpha off PNG24:play-feature-graphic.png
       The icon is ../tessera/icon/tessera-icon.svg inlined; the pivot is
       play-tablet/1-pivot.png. No words but the name: Play shows this
       graphic in every language that has none of its own. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009a80"/>
      <stop offset="1" stop-color="#006b59"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="230"/></clipPath>
    <clipPath id="card"><rect x="440" y="64" width="700" height="520" rx="20"/></clipPath>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- the icon's cells, large and faint, behind everything -->
  <g fill="#ffffff" opacity="0.06">
    <rect x="324" y="-60" width="176" height="176" rx="10"/>
    <rect x="324" y="124" width="176" height="176" rx="10"/>
    <rect x="324" y="308" width="176" height="176" rx="10"/>
  </g>

  <!-- the icon as a launcher tile -->
  <g transform="translate(72 84) scale(0.15625)" filter="url(#shadow)">
    <g clip-path="url(#tile)">
      <rect width="1024" height="1024" fill="#f2f9f6"/>
      <path fill="#00856e" d="M188 144 H836 A44 44 0 0 1 880 188 V320 H336 A16 16 0 0 0 320 336 V880 H188 A44 44 0 0 1 144 836 V188 A44 44 0 0 1 188 144 Z"/>
      <rect x="336" y="336" width="176" height="176" rx="10" fill="#adeedb"/>
      <rect x="520" y="336" width="176" height="176" rx="10" fill="#adeedb"/>
      <rect x="704" y="336" width="176" height="176" rx="10" fill="#adeedb"/>
      <rect x="336" y="520" width="176" height="176" rx="10" fill="#eed2ff"/>
      <rect x="520" y="520" width="176" height="176" rx="10" fill="#eed2ff"/>
      <rect x="704" y="520" width="176" height="176" rx="10" fill="#eed2ff"/>
      <rect x="336" y="704" width="176" height="176" rx="10" fill="#f5dc98"/>
      <rect x="520" y="704" width="176" height="176" rx="10" fill="#f5dc98"/>
      <rect x="704" y="704" width="176" height="176" rx="10" fill="#f5dc98"/>
    </g>
  </g>

  <g font-family="Noto Sans" font-weight="600" font-size="64" fill="#ffffff">
    <text x="68" y="330">Tessera</text>
    <text x="68" y="404">Studio</text>
  </g>

  <!-- the pivot, from the tablet screenshot at half size, off the edges -->
  <g filter="url(#shadow)">
    <g clip-path="url(#card)">
      <rect x="440" y="64" width="700" height="520" fill="#f4faf7"/>
      <image xlink:href="play-tablet/1-pivot.png" x="440" y="-48" width="1280" height="720"/>
    </g>
  </g>
</svg>
