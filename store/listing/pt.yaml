  - Somas, contagens, médias, mínimos, máximos, valores distintos, desvios padrão e fórmulas
  - Porcentagens de um total, totais acumulados e classificações
  - Filtros e ordenação por rótulos ou por valores
  - Detecta tipos de coluna, datas e formatos de número e se lembra dos seus ajustes
  - Reabre um arquivo na tabela dinâmica em que você o deixou
  - Exporta para Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON e JSON Lines
  - Instantâneos Tessera que reabrem exatamente como estavam
  - Abre arquivos arrastando e soltando, com "Abrir com" ou pela área de transferência
  - Seis estilos de grade, temas claro e escuro
  - 14 idiomas
  - Nunca altera seus arquivos
  - Grátis e sem anúncios para sempre, sem conta e sem rastreamento

