description: |-
  Tessera Studio превращает ваши файлы с данными в сводные таблицы. Откройте файл CSV, Excel, OpenDocument или JSON — и он сразу появится в виде сводной таблицы, готовой к анализу: группируйте строки и столбцы, раскрывайте и сворачивайте уровни, добавляйте суммы, количества и средние, фильтруйте и сортируйте. Когда результат готов, сохраните его или поделитесь им как книгой Excel, PDF, веб-страницей или в другом формате.

  Это программа для просмотра, а не редактор: ваши файлы никогда не изменяются, и ничто не покидает устройство, если вы сами это не сохраните или не отправите.

  ОТКРЫТИЕ
  • CSV и текст с разделителями-табуляциями (разделитель определяется автоматически), Excel (.xlsx), OpenDocument (.ods), JSON и JSON Lines
  • через выбор файлов, из других приложений («Открыть с помощью», «Поделиться»), перетаскиванием на компьютере или из буфера обмена: веб-адрес или ячейки, скопированные из таблицы
  • типы столбцов, подписи, даты и форматы чисел определяются автоматически; настройте их один раз, и Tessera Studio запомнит их для всех файлов с теми же столбцами

  АНАЛИЗ
  • строки и столбцы во вложенных уровнях, которые раскрываются и сворачиваются
  • суммы, количества, средние, минимумы, максимумы, количество различных значений, стандартные отклонения и собственные формулы
  • значения в процентах от итога, нарастающие итоги и ранги
  • фильтры и сортировка по подписям или по значениям
  • повторно открытый файл возвращается к той сводной таблице, на которой вы остановились
  • полноэкранный режим на телефоне: коснитесь значения, чтобы оставить только сетку

  СОХРАНЕНИЕ И ОТПРАВКА
  • сводная таблица в том виде, как она показана: Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON или JSON Lines
  • исходные строки как простая таблица: Excel, OpenDocument, CSV или JSON Lines
  • снимок Tessera: данные и сводная таблица в одном файле, который открывается точно в том же виде

  ПО ВАШЕМУ ВКУСУ
  • шесть стилей сетки — от классического вида электронной таблицы до высокого контраста; экспорт следует выбранному стилю
  • светлая и тёмная темы
  • 14 языков: английский, венгерский, испанский, итальянский, китайский, немецкий, нидерландский, польский, португальский, русский, турецкий, французский, чешский и японский

  БЕСПЛАТНО НАВСЕГДА
  Без рекламы, без встроенных покупок, без подписок, без учётной записи. Без аналитики и слежки: приложение выходит в сеть, только когда вы сами открываете веб-адрес или ссылку. Tessera Studio — программа с открытым исходным кодом (лицензия MIT), основанная на tessera — движке сводных таблиц с открытым исходным кодом для Dart и Flutter.

features:
  - Открывает файлы CSV, с разделителями-табуляциями, Excel (.xlsx), OpenDocument (.ods), JSON и JSON Lines
  - Показывает любую таблицу как сводную, с вложенными строками и столбцами, которые раскрываются
  - Суммы, количества, средние, минимумы, максимумы, различные значения, стандартные отклонения и формулы
  - Проценты от итога, нарастающие итоги и ранги
  - Фильтры и сортировка по подписям или по значениям
  - Определяет типы столбцов, даты и форматы чисел и запоминает ваши настройки
  - Открывает файл снова на той сводной таблице, на которой вы остановились
  - Экспорт в Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON и JSON Lines
  - Снимки Tessera, которые открываются точно в том же виде
  - Открытие файлов перетаскиванием, через «Открыть с помощью» или из буфера обмена
  - Шесть стилей сетки, светлая и тёмная темы
  - 14 языков
  - Никогда не изменяет ваши файлы
  - Бесплатно и без рекламы навсегда, без учётной записи и без слежки

