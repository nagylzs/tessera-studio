description: |-
  Tessera Studio は、お手持ちのデータファイルをピボットテーブルにします。CSV、Excel、OpenDocument、JSON ファイルを開くと、すぐにピボットテーブルとして表示され、そのまま分析できます。行と列のグループ化、階層の展開と折りたたみ、合計・件数・平均の追加、フィルター、並べ替え。必要な形になったら、Excel ブック、PDF、Web ページなどの形式で保存または共有できます。

  編集ではなく閲覧のためのアプリです。ファイルが変更されることはなく、保存や共有をしない限り、データが端末の外に出ることはありません。

  開く
  • CSV とタブ区切りテキスト（区切り文字は自動判別）、Excel (.xlsx)、OpenDocument (.ods)、JSON、JSON Lines
  • ファイル選択、他のアプリから（「このアプリで開く」、共有）、パソコンではドラッグ＆ドロップ、クリップボードから（Web アドレスや、スプレッドシートからコピーしたセル）
  • 列の種類、ラベル、日付、数値の書式を自動判別。一度調整すれば、同じ列を持つファイルでは Tessera Studio が覚えておきます

  分析する
  • 展開・折りたたみできる、入れ子の階層の行と列
  • 合計、件数、平均、最小値、最大値、異なる値の数、標準偏差、独自の数式
  • 合計に対する割合、累計、順位
  • フィルター、ラベルまたは値による並べ替え
  • 開き直したファイルは、前回のピボットテーブルの状態で表示
  • スマートフォンでは全画面表示：値をタップするとグリッドだけが残ります

  保存と共有
  • 表示どおりのピボットテーブルを Excel、OpenDocument、PDF、HTML、SVG、CSV、JSON、JSON Lines で
  • 元の行をシンプルな表として Excel、OpenDocument、CSV、JSON Lines で
  • Tessera スナップショット：データとピボットテーブルを 1 つのファイルにまとめ、そのままの状態で開き直せます

  好みに合わせて
  • クラシックなスプレッドシート風からハイコントラストまで、6 種類のグリッドスタイル。エクスポートも選んだスタイルに従います
  • ライトテーマとダークテーマ
  • 14 言語：日本語、英語、イタリア語、オランダ語、スペイン語、チェコ語、中国語、トルコ語、ドイツ語、ハンガリー語、フランス語、ポーランド語、ポルトガル語、ロシア語

  ずっと無料
  広告なし、アプリ内課金なし、サブスクリプションなし、アカウント不要。分析もトラッキングもありません。アプリが通信するのは、あなたが Web アドレスやリンクを開いたときだけです。Tessera Studio はオープンソース（MIT ライセンス）で、Dart と Flutter 向けのオープンソースのピボットテーブル エンジン tessera を基盤にしています。

