description: |-
  Tessera Studio zamienia pliki z danymi, które już masz, w tabele przestawne. Otwórz plik CSV, Excel, OpenDocument lub JSON, a od razu pojawi się jako tabela przestawna gotowa do analizy: grupuj wiersze i kolumny, rozwijaj i zwijaj poziomy, dodawaj sumy, liczebności i średnie, filtruj i sortuj. Gdy masz to, czego potrzebujesz, zapisz lub udostępnij wynik jako skoroszyt Excel, PDF, stronę internetową lub w innym formacie.

  To przeglądarka, a nie edytor: Twoje pliki nigdy nie są zmieniane i nic nie opuszcza Twojego urządzenia, chyba że sam to zapiszesz lub udostępnisz.

  OTWIERANIE
  • CSV i tekst rozdzielany tabulatorami (separator jest wykrywany), Excel (.xlsx), OpenDocument (.ods), JSON i JSON Lines
  • z wyboru plików, z innych aplikacji („Otwórz za pomocą”, udostępnianie), przez przeciąganie na komputerze lub ze schowka: adres internetowy albo komórki skopiowane z arkusza
  • typy kolumn, etykiety, daty i formaty liczb są wykrywane; dostosuj je raz, a Tessera Studio zapamięta je dla każdego pliku z tymi samymi kolumnami

  ANALIZA
  • wiersze i kolumny w zagnieżdżonych poziomach, które się rozwijają i zwijają
  • sumy, liczebności, średnie, minima, maksima, liczby unikalnych wartości, odchylenia standardowe i własne formuły
  • wartości jako procent sumy, sumy narastające i rangi
  • filtry oraz sortowanie według etykiet lub wartości
  • ponownie otwarty plik wraca do tej samej tabeli przestawnej, na której skończyłeś
  • pełny ekran na telefonie: dotknij wartości, aby ukryć wszystko oprócz siatki

  WYKRESY
  • słupki, słupki skumulowane, linia, wykres kołowy lub punktowy, obok siatki lub na telefonie zamiast niej, także na pełnym ekranie
  • z tabeli przestawnej, jak ją widać, ze wszystkich danych według wybranych kolumn lub z rekordów za jedną komórką; wykres punktowy pokaże nawet każdy rekord
  • zapis lub udostępnianie jako PNG, SVG lub PDF, jasne lub ciemne, z tłem lub bez

  ZAPIS I UDOSTĘPNIANIE
  • tabela przestawna tak, jak ją widać: Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON lub JSON Lines
  • wiersze źródłowe jako zwykła tabela: Excel, OpenDocument, CSV lub JSON Lines
  • migawka Tessera: dane i tabela przestawna w jednym pliku, który otwiera się dokładnie tak, jak był

  PO SWOJEMU
  • 24 style siatki w galerii, od klasycznego arkusza po dużą czcionkę; kolor według poziomu wierszy, kolumn lub obu; eksporty zachowują wybrany styl
  • jasny i ciemny motyw
  • 14 języków: angielski, chiński, czeski, francuski, hiszpański, holenderski, japoński, niemiecki, polski, portugalski, rosyjski, turecki, węgierski i włoski

  ZA DARMO, NA ZAWSZE
  Bez reklam, bez zakupów w aplikacji, bez subskrypcji, bez konta. Bez analityki i śledzenia: aplikacja łączy się z siecią tylko wtedy, gdy sam otworzysz adres internetowy lub link. Tessera Studio ma otwarte źródła (licencja MIT) i jest zbudowana na tessera — otwartoźródłowym silniku tabel przestawnych dla Darta i Fluttera.

