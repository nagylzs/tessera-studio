description: |-
  Tessera Studio trasforma i file di dati che hai già in tabelle pivot. Apri un file CSV, Excel, OpenDocument o JSON e compare subito come tabella pivot da esplorare: raggruppa righe e colonne, espandi e comprimi i livelli, aggiungi somme, conteggi e medie, filtra e ordina. Quando hai ciò che ti serve, salvalo o condividilo come cartella di lavoro Excel, PDF, pagina web o in un altro formato.

  È un visualizzatore, non un editor: i tuoi file non vengono mai modificati e nulla lascia il tuo dispositivo, a meno che tu non lo salvi o lo condivida.

  APRIRE
  • CSV e testo separato da tabulazioni (il separatore viene rilevato), Excel (.xlsx), OpenDocument (.ods), JSON e JSON Lines
  • dal selettore di file, da altre app («Apri con», condivisione), trascinando sul computer o dagli appunti: un indirizzo web o celle copiate da un foglio di calcolo
  • tipi di colonna, etichette, date e formati numerici vengono rilevati; regolali una volta e Tessera Studio li ricorda per ogni file con le stesse colonne

  ESPLORARE
  • righe e colonne in livelli annidati che si espandono e si comprimono
  • somme, conteggi, medie, minimi, massimi, conteggi distinti, deviazioni standard e formule personalizzate
  • valori come percentuale di un totale, totali progressivi e classifiche
  • filtri e ordinamento per etichette o per valori
  • un file riaperto torna con la tabella pivot in cui l’avevi lasciato
  • schermo intero sul telefono: tocca un valore per lasciare solo la griglia

  SALVARE E CONDIVIDERE
  • la tabella pivot così come appare, in Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON o JSON Lines
  • le righe sottostanti come tabella semplice, in Excel, OpenDocument, CSV o JSON Lines
  • uno snapshot Tessera: i dati e la tabella pivot in un unico file che si riapre esattamente com’era

  A TUO GUSTO
  • sei stili di griglia, dall’aspetto classico del foglio di calcolo al contrasto elevato; le esportazioni seguono lo stile scelto
  • temi chiaro e scuro
  • 14 lingue: ceco, cinese, francese, giapponese, inglese, italiano, olandese, polacco, portoghese, russo, spagnolo, tedesco, turco e ungherese

  GRATIS, PER SEMPRE
  Niente pubblicità, niente acquisti in-app, niente abbonamenti, niente account. Niente analisi e niente tracciamento: l’app va online solo quando apri tu un indirizzo web o un link. Tessera Studio è open source (licenza MIT) e si basa su tessera, un motore open source per tabelle pivot in Dart e Flutter.

