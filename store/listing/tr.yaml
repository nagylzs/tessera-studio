description: |-
  Tessera Studio, elinizdeki veri dosyalarını pivot tablolara dönüştürür. Bir CSV, Excel, OpenDocument veya JSON dosyası açın; hemen keşfedebileceğiniz bir pivot tablo olarak görünür: satırları ve sütunları gruplayın, düzeyleri açıp kapatın, toplam, sayı ve ortalama ekleyin, filtreleyin ve sıralayın. İstediğinizi elde ettiğinizde sonucu Excel çalışma kitabı, PDF, web sayfası veya başka bir biçimde kaydedin ya da paylaşın.

  Bir görüntüleyicidir, düzenleyici değil: dosyalarınız asla değiştirilmez ve siz kaydetmedikçe ya da paylaşmadıkça hiçbir şey cihazınızdan çıkmaz.

  AÇMA
  • CSV ve sekmeyle ayrılmış metin (ayırıcı algılanır), Excel (.xlsx), OpenDocument (.ods), JSON ve JSON Lines
  • dosya seçiciden, diğer uygulamalardan ("Birlikte aç", paylaş), bilgisayarda sürükleyip bırakarak veya panodan: bir web adresi ya da bir elektronik tablodan kopyalanan hücreler
  • sütun türleri, etiketler, tarihler ve sayı biçimleri algılanır; bir kez ayarlayın, Tessera Studio aynı sütunlara sahip her dosya için hatırlar

  KEŞFETME
  • açılıp kapanan iç içe düzeylerde satırlar ve sütunlar
  • toplam, sayı, ortalama, en küçük, en büyük, benzersiz değer sayısı, standart sapma ve kendi formülleriniz
  • bir toplamın yüzdesi olarak değerler, kümülatif toplamlar ve sıralar
  • filtreler ve etiketlere ya da değerlere göre sıralama
  • yeniden açtığınız bir dosya, bıraktığınız pivot tabloyla geri gelir
  • telefonda tam ekran: yalnızca ızgarayı bırakmak için bir değere dokunun

  KAYDETME VE PAYLAŞMA
  • pivot tablo göründüğü gibi: Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON veya JSON Lines
  • alttaki satırlar düz tablo olarak: Excel, OpenDocument, CSV veya JSON Lines
  • Tessera anlık görüntüsü: veriler ve pivot tablo, tam olarak olduğu gibi yeniden açılan tek bir dosyada

  ZEVKİNİZE GÖRE
  • klasik elektronik tablo görünümünden yüksek karşıtlığa altı ızgara stili; dışa aktarımlar seçtiğiniz stili izler
  • açık ve koyu tema
  • 14 dil: Almanca, Çekçe, Çince, Fransızca, Felemenkçe, İngilizce, İspanyolca, İtalyanca, Japonca, Lehçe, Macarca, Portekizce, Rusça ve Türkçe

  ÜCRETSİZ, SONSUZA DEK
  Reklam yok, uygulama içi satın alma yok, abonelik yok, hesap yok. Analiz ve izleme yok: uygulama yalnızca siz bir web adresi veya bağlantı açtığınızda internete bağlanır. Tessera Studio açık kaynaklıdır (MIT lisansı) ve Dart ile Flutter için açık kaynaklı bir pivot tablo motoru olan tessera üzerine kuruludur.

