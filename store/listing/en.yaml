# Every store's description (≤ 4000: Google Play and the App Store; the
# Microsoft Store allows 10 000). Plain text, no URLs.
description: |-
  Tessera Studio turns the data files you already have into pivot tables. Open a CSV, Excel, OpenDocument or JSON file and it appears as a pivot you can explore right away: group rows and columns, open and close the levels, add sums, counts and averages, filter and sort. When you have what you need, save or share it as an Excel workbook, a PDF, a web page or another format.

  It is a viewer, not an editor: your files are never changed, and nothing leaves your device unless you save or share it.

  OPEN
  • CSV and tab-separated text (the separator is detected), Excel (.xlsx), OpenDocument (.ods), JSON and JSON Lines
  • from the file picker, from other apps ("Open with", share), by drag and drop on the desktop, or from the clipboard: a web address, or cells copied from a spreadsheet
  • column types, labels, dates and number formats are detected; adjust them once and Tessera Studio remembers them for every file with the same columns

  EXPLORE
  • rows and columns in nested levels that open and close
  • sums, counts, averages, minimums, maximums, distinct counts, standard deviations and your own formulas
  • values as a percentage of a total, running totals and ranks
  • filters, and sorting by labels or by values
  • a file you open again comes back on the pivot you left it on
  • full screen on phones: tap a value to hide everything but the grid

  SAVE AND SHARE
  • the pivot as shown, in Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON or JSON Lines
  • the underlying rows as a plain table in Excel, OpenDocument, CSV or JSON Lines
  • a Tessera snapshot: the data and the pivot in one file that reopens exactly as it was

  MAKE IT YOURS
  • six grid styles, from a classic spreadsheet look to high contrast; exports follow the style you choose
  • light and dark themes
  • 14 languages: Chinese, Czech, Dutch, English, French, German, Hungarian, Italian, Japanese, Polish, Portuguese, Russian, Spanish and Turkish

  FREE, FOREVER
  No ads, no in-app purchases, no subscriptions, no account. No analytics and no tracking: the app goes online only when you open a web address or a link yourself. Tessera Studio is open source (MIT license) and built on tessera, an open-source pivot table engine for Dart and Flutter.

# Microsoft Store product features (≤ 20 items, ≤ 200 each; the Store
# adds the bullets).
features:
  - Opens CSV, tab-separated, Excel (.xlsx), OpenDocument (.ods), JSON and JSON Lines files
  - Shows any table as a pivot, with nested rows and columns that open and close
  - Sums, counts, averages, minimums, maximums, distinct counts, standard deviations and formulas
  - Percentages of totals, running totals and ranks
  - Filters, and sorting by labels or by values
  - Detects column types, dates and number formats, and remembers your adjustments
  - Reopens a file on the pivot you left it on
  - Exports to Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON and JSON Lines
  - Tessera snapshots that reopen exactly as they were
  - Opens files by drag and drop, "Open with", or from the clipboard
  - Six grid styles, light and dark themes
  - 14 languages
  - Never changes your files
  - Free and ad-free forever, with no account and no tracking

