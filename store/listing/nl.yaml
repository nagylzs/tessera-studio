description: |-
  Tessera Studio maakt van de gegevensbestanden die u al hebt draaitabellen. Open een CSV-, Excel-, OpenDocument- of JSON-bestand en het verschijnt meteen als draaitabel om te verkennen: groepeer rijen en kolommen, klap niveaus in en uit, voeg sommen, aantallen en gemiddelden toe, filter en sorteer. Hebt u wat u nodig hebt, sla het dan op of deel het als Excel-werkmap, pdf, webpagina of in een ander formaat.

  Het is een viewer, geen editor: uw bestanden worden nooit gewijzigd en er verlaat niets uw apparaat, tenzij u het opslaat of deelt.

  OPENEN
  • CSV en door tabs gescheiden tekst (het scheidingsteken wordt herkend), Excel (.xlsx), OpenDocument (.ods), JSON en JSON Lines
  • via de bestandskiezer, vanuit andere apps (‘Openen met’, delen), door slepen op de computer of vanaf het klembord: een webadres of cellen gekopieerd uit een spreadsheet
  • kolomtypen, labels, datums en getalnotaties worden herkend; pas ze één keer aan en Tessera Studio onthoudt ze voor elk bestand met dezelfde kolommen

  VERKENNEN
  • rijen en kolommen in geneste niveaus die in- en uitklappen
  • sommen, aantallen, gemiddelden, minima, maxima, aantallen unieke waarden, standaarddeviaties en eigen formules
  • waarden als percentage van een totaal, lopende totalen en rangen
  • filters, en sorteren op labels of op waarden
  • een bestand dat u opnieuw opent, komt terug met de draaitabel waar u het liet
  • volledig scherm op de telefoon: tik op een waarde om alles behalve het raster te verbergen

  OPSLAAN EN DELEN
  • de draaitabel zoals weergegeven, als Excel, OpenDocument, PDF, HTML, SVG, CSV, JSON of JSON Lines
  • de onderliggende rijen als eenvoudige tabel, in Excel, OpenDocument, CSV of JSON Lines
  • een Tessera-snapshot: de gegevens en de draaitabel in één bestand dat precies zo weer opent

  NAAR UW SMAAK
  • zes rasterstijlen, van een klassieke spreadsheetlook tot hoog contrast; exports volgen de gekozen stijl
  • licht en donker thema
  • 14 talen: Chinees, Duits, Engels, Frans, Hongaars, Italiaans, Japans, Nederlands, Pools, Portugees, Russisch, Spaans, Tsjechisch en Turks

  VOOR ALTIJD GRATIS
  Geen reclame, geen in-app-aankopen, geen abonnementen, geen account. Geen analyse en geen tracking: de app gaat alleen online als u zelf een webadres of link opent. Tessera Studio is open source (MIT-licentie) en gebouwd op tessera, een open-source draaitabel-engine voor Dart en Flutter.

