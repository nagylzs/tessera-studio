name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # "Run workflow" on GitHub: the same, with the builds to download.
  workflow_dispatch:

# A newer push to the same branch supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every platform is built on every push, unsigned — Android with the debug
# key the Gradle config falls back to, iOS with --no-codesign, macOS ad
# hoc — to prove it compiles. Signing keys and store credentials never
# enter the repository; signed release builds come with CI secrets later.
# The builds are kept as downloads only for tags and manual runs.
env:
  KEEP_BUILDS: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
  # Every job builds with this Flutter, the one the store uploads were
  # built with on the Mac; bump it here and there together.
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Google Play upload key, when the repository has it: the
      # keystore as base64 and its password (alias "upload"; a PKCS12
      # keystore has one password for the store and the key). Without
      # them the release builds are signed with the debug key.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$PASSWORD" "$PASSWORD" > android/key.properties
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Signer
        run: >-
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab
          | grep -E 'Owner:|SHA256:'
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 14

  # The tarball and the .deb, per architecture, built in Ubuntu 22.04 so
  # they run on glibc 2.35 and later (Ubuntu 22.04+, Debian 12+, Fedora
  # 36+) whatever the runner image is; Flutter from its git tag, as it
  # publishes no arm64 Linux SDK archive. tool/linux_package.sh.
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 40
    steps:
      # Before the checkout, which needs git for a repository (the
      # packaging takes its file times from the last commit).
      - name: Install the Linux desktop and packaging toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip xz-utils zip file \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            dpkg-dev librsvg2-bin
      - uses: actions/checkout@v5
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git /opt/flutter
          echo /opt/flutter/bin >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --disable-analytics
          /opt/flutter/bin/flutter --version
      - run: flutter build linux --release
      - run: tool/linux_package.sh ${{ matrix.arch }}
      - name: Package contents
        run: |
          cd build/linux/packages
          ls -l
          dpkg-deb --info tessera-studio_*.deb
          dpkg-deb --contents tessera-studio_*.deb | grep -v flutter_assets/
      # Always, for the test job; kept like the other builds for tags and
      # manual runs.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/linux/packages/*.tar.gz
            build/linux/packages/*.deb
          retention-days: ${{ env.KEEP_BUILDS == 'true' && 14 || 1 }}

  # The packages in fresh containers, as a user gets them: the .deb with
  # its Depends from the archive, the tarball's install.sh, "Open with"
  # on a virtual display. tool/linux_smoke_test.sh.
  linux-test:
    name: Linux test (${{ matrix.image }}, ${{ matrix.arch }})
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, image: 'ubuntu:22.04' }
          - { arch: x64, runner: ubuntu-24.04, image: 'ubuntu:24.04' }
          - { arch: x64, runner: ubuntu-24.04, image: 'debian:12' }
          - { arch: arm64, runner: ubuntu-24.04-arm, image: 'ubuntu:22.04' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/linux/packages
      - run: tool/linux_smoke_test.sh build/linux/packages
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-${{ matrix.arch }}-${{ strategy.job-index }}
          path: build/linux/smoke
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      # The portable download: the app folder plus the Visual C++ runtime
      # a fresh Windows may lack (Microsoft allows it next to the app),
      # taken from this machine's Visual Studio, zipped.
      - name: Portable zip
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'No Visual C++ runtime redistributable found' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $dir = 'build\portable\Tessera Studio'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* $dir
          Copy-Item "$($crt.FullName)\*.dll" $dir
          Compress-Archive -Path $dir -DestinationPath "build\portable\tessera-studio-$version-windows-x64-portable.zip"
          Get-ChildItem -Recurse build\portable -Filter *.dll | Select-Object Name
      # The Store package once the Partner Center identity is in the
      # repository variables (Settings → Secrets and variables → Actions
      # → Variables; they are public in the Store, so not secrets); a
      # package signed with the msix tool's test certificate until then,
      # for trying the installation and the file associations.
      - name: MSIX
        shell: pwsh
        env:
          IDENTITY: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          # The Store reserves the package version's fourth part (it must
          # be 0) and wants every upload higher than the last, so the
          # pubspec's build number goes into the third: 1.0.0+4 → 1.0.4.0
          # (msix itself would make every 1.0.0+N 1.0.0.0). About still
          # says 1.0.0 (4).
          $m = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)\.\d+\+(\d+)\s*$').Matches
          if (-not $m) { throw 'The pubspec version is not x.y.z+N' }
          $g = $m[0].Groups
          $msixVersion = "$($g[1].Value).$($g[2].Value).$($g[3].Value).0"
          Write-Output "MSIX version $msixVersion"
          if ($env:IDENTITY) {
            dart run msix:create --build-windows false --store --version $msixVersion `
              --identity-name $env:IDENTITY `
              --publisher $env:PUBLISHER `
              --publisher-display-name $env:PUBLISHER_NAME
          } else {
            dart run msix:create --build-windows false --version $msixVersion
          }
          Get-ChildItem build\msix
          # The manifest inside the package must carry that version.
          Copy-Item build\msix\tessera-studio.msix build\msix-check.zip
          Expand-Archive build\msix-check.zip build\msix-check
          $identity = ([xml](Get-Content build\msix-check\AppxManifest.xml)).Package.Identity
          Write-Output "Package $($identity.Name) $($identity.Version)"
          if ($identity.Version -ne $msixVersion) { throw "The package says $($identity.Version)" }
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/portable/*.zip
            build/msix/*.msix
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/*.app
          retention-days: 14

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # An unsigned build cannot be installed; it proves the app compiles.
      - run: flutter build ios --release --no-codesign

  # On a v* tag, once every build and test has passed: a draft GitHub
  # Release with the downloads that are not in a store (the Linux
  # tarballs and .debs, the Windows portable zip) and their SHA-256 sums.
  # The owner writes the notes and publishes it. A re-run replaces the
  # files of a draft and leaves a published release alone.
  release:
    name: Release draft
    if: github.ref_type == 'tag'
    needs: [test, android, web, linux, linux-test, windows, macos, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: windows
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The MSIX is for the Store only (it cannot be sideloaded).
          cp windows/portable/*.zip release/
          cd release
          sha256sum -- * > SHA256SUMS
          ls -l
          cat SHA256SUMS
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case $draft in
            none)
              gh release create "$TAG" --draft --verify-tag \
                --title "Tessera Studio ${TAG#v}" \
                --notes "Made by CI from $TAG. Write the notes, then publish." \
                ./* ;;
            true) gh release upload "$TAG" --clobber ./* ;;
            *) echo "$TAG is already published; its files are left as they are" ;;
          esac
