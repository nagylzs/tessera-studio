name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # "Run workflow" on GitHub: the same, with the builds to download.
  workflow_dispatch:

# A newer push to the same branch supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every platform is built on every push, unsigned — Android with the debug
# key the Gradle config falls back to, iOS with --no-codesign, macOS ad
# hoc — to prove it compiles. Signing keys and store credentials never
# enter the repository; signed release builds come with CI secrets later.
# The builds are kept as downloads only for tags and manual runs.
env:
  KEEP_BUILDS: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 14

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build linux --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: build/windows/x64/runner/Release
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/*.app
          retention-days: 14

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # An unsigned build cannot be installed; it proves the app compiles.
      - run: flutter build ios --release --no-codesign
