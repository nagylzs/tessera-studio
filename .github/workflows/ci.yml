name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  # "Run workflow" on GitHub: the same, with the builds to download.
  workflow_dispatch:

# A newer push to the same branch supersedes the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every platform is built on every push, unsigned — Android with the debug
# key the Gradle config falls back to, iOS with --no-codesign, macOS ad
# hoc — to prove it compiles. Signing keys and store credentials never
# enter the repository; signed release builds come with CI secrets later.
# The builds are kept as downloads only for tags and manual runs.
env:
  KEEP_BUILDS: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The Google Play upload key, when the repository has it: the
      # keystore as base64 and its password (alias "upload"; a PKCS12
      # keystore has one password for the store and the key). Without
      # them the release builds are signed with the debug key.
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
            "$PASSWORD" "$PASSWORD" > android/key.properties
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Signer
        run: >-
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab
          | grep -E 'Owner:|SHA256:'
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            build/app/outputs/flutter-apk/*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build web --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
          retention-days: 14

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build linux --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release
      # The portable download: the app folder plus the Visual C++ runtime
      # a fresh Windows may lack (Microsoft allows it next to the app),
      # taken from this machine's Visual Studio, zipped.
      - name: Portable zip
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw 'No Visual C++ runtime redistributable found' }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $dir = 'build\portable\Tessera Studio'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item -Recurse build\windows\x64\runner\Release\* $dir
          Copy-Item "$($crt.FullName)\*.dll" $dir
          Compress-Archive -Path $dir -DestinationPath "build\portable\tessera-studio-$version-windows-x64-portable.zip"
          Get-ChildItem -Recurse build\portable -Filter *.dll | Select-Object Name
      # The Store package once the Partner Center identity is in the
      # repository variables (Settings → Secrets and variables → Actions
      # → Variables; they are public in the Store, so not secrets); a
      # package signed with the msix tool's test certificate until then,
      # for trying the installation and the file associations.
      - name: MSIX
        shell: pwsh
        env:
          IDENTITY: ${{ vars.MSIX_IDENTITY_NAME }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          # The Store reserves the package version's fourth part (it must
          # be 0) and wants every upload higher than the last, so the
          # pubspec's build number goes into the third: 1.0.0+4 → 1.0.4.0
          # (msix itself would make every 1.0.0+N 1.0.0.0). About still
          # says 1.0.0 (4).
          $m = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)\.\d+\+(\d+)\s*$').Matches
          if (-not $m) { throw 'The pubspec version is not x.y.z+N' }
          $g = $m[0].Groups
          $msixVersion = "$($g[1].Value).$($g[2].Value).$($g[3].Value).0"
          Write-Output "MSIX version $msixVersion"
          if ($env:IDENTITY) {
            dart run msix:create --build-windows false --store --version $msixVersion `
              --identity-name $env:IDENTITY `
              --publisher $env:PUBLISHER `
              --publisher-display-name $env:PUBLISHER_NAME
          } else {
            dart run msix:create --build-windows false --version $msixVersion
          }
          Get-ChildItem build\msix
          # The manifest inside the package must carry that version.
          Copy-Item build\msix\tessera-studio.msix build\msix-check.zip
          Expand-Archive build\msix-check.zip build\msix-check
          $identity = ([xml](Get-Content build\msix-check\AppxManifest.xml)).Package.Identity
          Write-Output "Package $($identity.Name) $($identity.Version)"
          if ($identity.Version -ne $msixVersion) { throw "The package says $($identity.Version)" }
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            build/portable/*.zip
            build/msix/*.msix
          retention-days: 14

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build macos --release
      - if: env.KEEP_BUILDS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/macos/Build/Products/Release/*.app
          retention-days: 14

  ios:
    name: iOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # An unsigned build cannot be installed; it proves the app compiles.
      - run: flutter build ios --release --no-codesign
